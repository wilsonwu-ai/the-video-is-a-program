<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="eight-pieces-title eight-pieces-desc" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="eight-pieces-title">The kit behind the viral videos</title>
<desc id="eight-pieces-desc">Eight tiles naming the parts of the video-making kit: a seekable frame function with headless render, a coding-agent rig, a production brief, visual references, state storyboards, spring motion with synthesized audio, a critique loop on contact sheets, and packaging as a skill.</desc>
